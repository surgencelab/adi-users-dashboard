<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADI active users</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body data-theme="light" data-aesthetic="institutional" data-density="cozy">
  <script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      var a = localStorage.getItem('aesthetic');
      var d = localStorage.getItem('density');
      if (t) document.body.setAttribute('data-theme', t);
      if (a) document.body.setAttribute('data-aesthetic', a);
      if (d) document.body.setAttribute('data-density', d);
    } catch (e) {}
  })();
  </script>

  <div id="root" class="shell">
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>

  <script type="text/babel" src="charts.jsx?v=9"></script>
  <script type="text/babel" src="widgets.jsx?v=9"></script>
  <script type="text/babel" src="adi.jsx?v=9"></script>

  <script type="text/babel" data-presets="env,react">
    function lastComplete(rows) {
      for (let i = rows.length - 1; i >= 0; i--) if (!rows[i].partial) return rows[i];
      return rows[rows.length - 1];
    }

    function Overview({ d }) {
      const ps = d.predictstreet;
      const st = d.staking;
      const chain = d.chain;

      const psLast = ps ? lastComplete(ps.series) : null;

      const recent = ps ? ps.series.slice(-30) : [];
      const peakDau = recent.length ? Math.max.apply(null, recent.map(r => r.dau)) : 0;
      const stickiness = psLast && psLast.mau > 0 ? (psLast.dau / psLast.mau) * 100 : null;
      const activation = ps && psLast ? (psLast.mau / ps.registered_total) * 100 : null;

      const psWindow = ps ? ps.series : [];
      const chainWindow = chain.series;

      return (
        <React.Fragment>
          <div className="panel" style={{ marginBottom: 16 }}>
            <PanelHead title="Why these numbers are not signer counts" />
            <div className="panel-caption">
              <b>Counting wallets that send transactions would miss almost every user.</b>{' '}
              {ps ? (
                <React.Fragment>
                  When someone uses PredictStreet, the app sends the transaction for
                  them from its own wallets. So the wallet on the transaction is the
                  app, not the person. Out of {fmtCount(ps.distinct_owners)} people
                  signed up, only {fmtCount(ps.owners_that_self_signed)} have ever sent
                  a transaction themselves, which is {fmtPct(ps.signer_visible_pct, 2)}.
                  We count people instead by the personal account that PredictStreet
                  creates for each of them.
                </React.Fragment>
              ) : (
                'PredictStreet sends transactions on behalf of its users, so counting wallets counts the app, not people.'
              )}{' '}
              <a href="methodology.html" style={{ color: 'var(--orange)' }}>Read how we count</a>
            </div>
          </div>

          <div className="grid grid-4" style={{ marginBottom: 16 }}>
            <Metric label="PredictStreet sign-ups"
              value={fmtCount(ps ? ps.registered_total : null)}
              footer="Total people who have signed up" />
            <Metric label="PredictStreet users this month"
              value={fmtCount(psLast ? psLast.mau : null)}
              footer={`People active in the last ${d.meta.rolling_window_days} days`} />
            <Metric label="PredictStreet users yesterday"
              value={fmtCount(psLast ? psLast.dau : null)}
              footer={`People active that day. Busiest recent day: ${fmtCount(peakDau)}`} />
            <Metric label="People staking ADI"
              value={fmtCount(st ? st.unique_stakers : null)}
              footer={st && st.total_staked_usd
                ? `${fmtUSD(st.total_staked_usd)} staked on Ethereum`
                : 'People who have staked ADI'} />
          </div>

          <div className="grid grid-4" style={{ marginBottom: 16 }}>
            <Metric label="Came back to use it"
              value={activation === null ? 'n/a' : fmtPct(activation, 1)}
              footer="Share of signed-up people who were active in the last 30 days" />
            <Metric label="Use it on a given day"
              value={stickiness === null ? 'n/a' : fmtPct(stickiness, 2)}
              footer="Of the people active this month, the share who show up on a given day" />
            <Metric label="Still there after a month"
              value={ps && ps.retention
                ? fmtPct(ps.retention.still_active_30d_pct, 2) : 'n/a'}
              footer={ps && ps.retention
                ? `${fmtCount(ps.retention.still_active_30d)} of ${fmtCount(ps.retention.total_signed_up)} sign-ups`
                : 'n/a'} />
            <Metric label="Transactions on ADI Chain"
              value={fmtCount(chain.total_txs)}
              footer="Every transaction since the chain launched" />
          </div>

          {ps && (
            <ChartPanel
              title="Sign-ups compared with people actually using it"
              subtitle="PredictStreet"
              badge={`${fmtCount(ps.series.length)} days`}
              legend={[{ name: 'Registered (cumulative)', color: 'var(--chart-1)' }, { name: 'MAU (30d)', color: 'var(--chart-2)' }, { name: 'DAU', color: 'var(--chart-3)' }]}
              caption={<React.Fragment>
                <b>Far more people signed up than kept using it.</b> The top line is
                everyone who has ever signed up, so it only ever goes up. The two lower
                lines are people who actually did something. The gap between them is
                the part that matters.
              </React.Fragment>}
            >
              {(w, h) => (
                <AreaChart
                  width={w} height={h}
                  labels={labelsOf(psWindow)}
                  formatter={fmtNum}
                  series={[
                    { name: 'Registered (cumulative)', color: 'var(--chart-1)', values: pick(psWindow, 'registered_cumulative') },
                    { name: 'MAU (30d)', color: 'var(--chart-2)', values: pick(psWindow, 'mau') },
                    { name: 'DAU', color: 'var(--chart-3)', values: pick(psWindow, 'dau') },
                  ]}
                />
              )}
            </ChartPanel>
          )}

          <div className="grid grid-2" style={{ marginTop: 16 }}>
            {ps && (
              <ChartPanel
                title="New sign-ups each day"
                subtitle="VaultCreated events"
              legend={[{ name: 'New users', color: 'var(--chart-1)' }]}
                caption={<React.Fragment>
                  <b>How many people signed up each day.</b> The spike is the World
                  Cup. Because those sign-ups were recent, the 30 day figure still looks
                  healthy even though daily use has dropped right off.
                </React.Fragment>}
                height={240}
              >
                {(w, h) => (
                  <AreaChart
                    width={w} height={h}
                    labels={labelsOf(psWindow)}
                    formatter={fmtNum}
                    series={[{ name: 'New users', color: 'var(--chart-1)', values: pick(psWindow, 'new_users') }]}
                  />
                )}
              </ChartPanel>
            )}

            <ChartPanel
              title="How busy the chain is"
              subtitle="Transactions per day"
              legend={[{ name: 'Transactions', color: 'var(--chart-4)' }]}
              caption={<React.Fragment>
                <b>This counts transactions, not people.</b> The app bundles many
                user actions into its own transactions, so a busy chart means a busy
                chain, not necessarily more users.
              </React.Fragment>}
              height={240}
            >
              {(w, h) => (
                <AreaChart
                  width={w} height={h}
                  labels={labelsOf(chainWindow)}
                  formatter={fmtNum}
                  series={[{ name: 'Transactions', color: 'var(--chart-4)', values: pick(chainWindow, 'txs') }]}
                />
              )}
            </ChartPanel>
          </div>

          {st && st.leaderboard && st.leaderboard.length > 0 && (
            <div className="grid grid-2" style={{ marginTop: 16 }}>
              <ChartPanel
                title="Who owns the staked ADI"
                subtitle="Share held by each wallet"
                badge={`${st.unique_stakers} stakers`}
                caption={<React.Fragment>
                  <b>One wallet holds most of it.</b> Only {st.unique_stakers} people
                  have staked at all, so the total tells you about a handful of
                  decisions rather than broad interest.
                </React.Fragment>}
                height={260}
              >
                {(w, h) => (
                  <Donut
                    size={Math.min(220, Math.max(160, w * 0.35))}
                    thickness={30}
                    formatter={fmtUSD}
                    centerLabel={st.total_staked_usd ? fmtUSD(st.total_staked_usd) : undefined}
                    items={st.leaderboard.slice(0, 5).map((r, i) => ({
                      name: shortAddr(r.address),
                      value: r.staked_usd || r.staked_adi,
                      color: `var(--chart-${i + 1})`,
                    })).concat(st.leaderboard.length > 5 ? [{
                      name: 'Others',
                      value: st.leaderboard.slice(5).reduce((a, r) => a + (r.staked_usd || r.staked_adi), 0),
                      color: 'var(--chart-6)',
                    }] : [])}
                  />
                )}
              </ChartPanel>

              <ChartPanel
                title="How many people have staked"
                subtitle="ADI HODLER programme"
              legend={[{ name: 'Cumulative stakers', color: 'var(--chart-5)' }]}
                caption={<React.Fragment>
                  <b>Almost nobody joined after the first week.</b> Staking opened on{' '}
                  {st.series[0] ? st.series[0].date : 'n/a'} and has barely grown since.
                </React.Fragment>}
                height={260}
              >
                {(w, h) => (
                  <AreaChart
                    width={w} height={h}
                    labels={labelsOf(st.series)}
                    formatter={fmtNum}
                    series={[{ name: 'Cumulative stakers', color: 'var(--chart-5)', values: pick(st.series, 'cumulative_stakers') }]}
                  />
                )}
              </ChartPanel>
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <Page active="overview"
        title="ADI active users"
        subtitle="Daily and monthly active users across ADI Chain, PredictStreet and the ADI HODLER staking programme."
        render={(d) => <Overview d={d} />} />
    );
  </script>
</body>
</html>
