<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADI Chain activity</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body data-theme="light" data-aesthetic="institutional" data-density="cozy">
  <script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      var a = localStorage.getItem('aesthetic');
      var d = localStorage.getItem('density');
      if (t) document.body.setAttribute('data-theme', t);
      if (a) document.body.setAttribute('data-aesthetic', a);
      if (d) document.body.setAttribute('data-density', d);
    } catch (e) {}
  })();
  </script>

  <div id="root" class="shell">
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>

  <script type="text/babel" src="charts.jsx?v=7"></script>
  <script type="text/babel" src="widgets.jsx?v=7"></script>
  <script type="text/babel" src="adi.jsx?v=7"></script>

  <script type="text/babel" data-presets="env,react">
    function lastComplete(rows) {
      for (let i = rows.length - 1; i >= 0; i--) if (!rows[i].partial) return rows[i];
      return rows[rows.length - 1];
    }

    function ChainActivity({ d }) {
      const c = d.chain;
      const last = lastComplete(c.series);
      const peakTx = Math.max.apply(null, c.series.map(r => r.txs));
      const peakTxDay = (c.series.find(r => r.txs === peakTx) || {}).date;
      const peakSigners = Math.max.apply(null, c.series.map(r => r.dau_signers));
      const peakSignerDay = (c.series.find(r => r.dau_signers === peakSigners) || {}).date;
      const top10 = c.top_senders.slice(0, 10).reduce((a, s) => a + s.txs, 0);
      const top10Share = c.total_txs ? (top10 / c.total_txs) * 100 : 0;
      const ps = d.predictstreet;
      const h = c.holders;
      const e = c.ethereum_token;

      return (
        <React.Fragment>
          <div className="panel" style={{ marginBottom: 16 }}>
            <PanelHead title="This page counts wallets, not people" />
            <div className="panel-caption">
              <b>Ten wallets sent {fmtPct(top10Share, 1)} of every transaction ADI Chain
              has ever had.</b> Those belong to apps and to the chain's own plumbing, not
              to individual people.
              {ps ? ` Counting wallets this way would find only ${fmtPct(ps.signer_visible_pct, 2)} of PredictStreet's users.` : ''}{' '}
              For actual people, use the PredictStreet and Staking pages.
            </div>
          </div>

          {h && (
            <div className="grid grid-4" style={{ marginBottom: 16 }}>
              <Metric label="Addresses holding ADI" value={fmtCount(h.holders)}
                footer={`Checked every one of ${fmtCount(h.addresses_checked)} known addresses`} />
              <Metric label="ADI held on this chain"
                value={fmtCount(h.adi_held) + ' ADI'}
                footer={`${fmtPct(h.pct_of_total_supply, 3)} of the 1,000,000,000 total supply`} />
              <Metric label="Typical holding"
                value={h.median < 1 ? h.median.toFixed(4) + ' ADI' : fmtCount(h.median) + ' ADI'}
                footer={`${fmtCount(h.buckets.under_1)} addresses hold less than 1 ADI`} />
              <Metric label="Held by the top ten" value={fmtPct(h.top10_pct, 1)}
                footer={`${fmtCount(h.top10_adi)} ADI in ten addresses`} />
            </div>
          )}

          {h && (
            <div className="panel" style={{ marginBottom: 16 }}>
              <PanelHead title="Almost all of these holders hold dust"
                subtitle={`measured at block ${fmtCount(h.block)}`} />
              <div className="panel-caption">
                <b>{fmtCount(h.buckets.under_1)} of {fmtCount(h.holders)} addresses hold
                less than one ADI.</b> They were funded with just enough to pay for a
                transaction, not because someone chose to hold ADI here. The real
                balance sits in ten addresses, which between them hold{' '}
                {fmtPct(h.top10_pct, 1)} of all ADI on the chain.
              </div>
              <div className="panel-body flush">
                <table className="datatable">
                  <thead>
                    <tr><th>Size of holding</th><th className="num">Addresses</th><th className="num col-hide-sm">Share of holders</th></tr>
                  </thead>
                  <tbody>
                    {[['Less than 1 ADI','under_1'],['1 to 10 ADI','1_to_10'],
                      ['10 to 100 ADI','10_to_100'],['100 to 1,000 ADI','100_to_1k'],
                      ['More than 1,000 ADI','over_1k']].map(([label,key]) => (
                      <tr key={key}>
                        <td>{label}</td>
                        <td className="num">{fmtCount(h.buckets[key])}</td>
                        <td className="num col-hide-sm">{fmtPct(100 * h.buckets[key] / h.holders, 2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {e && (
            <div className="panel" style={{ marginBottom: 16 }}>
              <PanelHead title="ADI Chain holds a small slice of the ADI supply"
                subtitle="the same token, not a second one" />
              <div className="panel-caption">
                <b>Do not add these two numbers together.</b> ADI Chain runs on the
                Ethereum ADI token bridged across, so the ADI sitting on ADI Chain is
                already counted inside the Ethereum total. It is a slice of the same
                supply, not extra supply, and the holder counts are two separate
                ledgers rather than two groups of people.
              </div>
              <div className="panel-body flush">
                <table className="datatable">
                  <thead>
                    <tr>
                      <th>Where</th>
                      <th className="num">ADI</th>
                      <th className="num">Share of supply</th>
                      <th className="num col-hide-sm">Addresses holding</th>
                      <th className="num col-hide-sm">Holding 1 ADI or more</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>Total supply, on Ethereum</td>
                      <td className="num">{fmtCount(e.total_adi)}</td>
                      <td className="num">100%</td>
                      <td className="num col-hide-sm">{fmtCount(e.holders)}</td>
                      <td className="num col-hide-sm">{fmtCount(e.holders_over_1_adi)}</td>
                    </tr>
                    <tr>
                      <td style={{ paddingLeft: 24 }}>of which bridged to ADI Chain</td>
                      <td className="num">{fmtCount(h ? h.adi_held : null)}</td>
                      <td className="num">{h ? fmtPct(h.pct_of_total_supply, 3) : 'n/a'}</td>
                      <td className="num col-hide-sm">{fmtCount(h ? h.holders : null)}</td>
                      <td className="num col-hide-sm">
                        {h ? fmtCount(h.holders - h.buckets.under_1) : 'n/a'}
                      </td>
                    </tr>
                    <tr style={{ fontWeight: 600 }}>
                      <td style={{ paddingLeft: 24 }}>of which stays on Ethereum</td>
                      <td className="num">{fmtCount(h ? e.total_adi - h.adi_held : e.total_adi)}</td>
                      <td className="num">{h ? fmtPct(100 - h.pct_of_total_supply, 3) : '100%'}</td>
                      <td className="num col-hide-sm">n/a</td>
                      <td className="num col-hide-sm">n/a</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="grid grid-4" style={{ marginBottom: 16 }}>
            <Metric label="Transactions ever" value={fmtCount(c.total_txs)}
              footer="Since the chain launched on 2025-11-25" />
            <Metric label="Wallets that ever sent one" value={fmtCount(c.total_distinct_senders)}
              footer="Mostly apps and infrastructure, not people" />
            <Metric label={`Wallets active on ${last ? last.date : 'n/a'}`}
              value={fmtCount(last ? last.dau_signers : null)}
              footer={`Most ever in a day: ${fmtCount(peakSigners)} on ${peakSignerDay || 'n/a'}`} />
            <Metric label="Share sent by the top ten" value={fmtPct(top10Share, 1)}
              footer="Ten wallets, this much of all traffic" />
          </div>

          <ChartPanel
            title="Transactions each day"
            subtitle="Everything the chain processed"
              legend={[{ name: 'Transactions', color: 'var(--chart-4)' }]}
            badge={`Peak ${fmtCount(peakTx)}`}
            caption={<React.Fragment>
              <b>How much work the chain is doing.</b> The peak on {peakTxDay || 'n/a'}
               was during the World Cup, when the prediction app was busiest.
            </React.Fragment>}
          >
            {(w, h) => (
              <AreaChart
                width={w} height={h}
                labels={labelsOf(c.series)}
                formatter={fmtNum}
                series={[{ name: 'Transactions', color: 'var(--chart-4)', values: pick(c.series, 'txs') }]}
              />
            )}
          </ChartPanel>

          <div className="grid grid-2" style={{ marginTop: 16 }}>
            <ChartPanel
              title="Wallets sending transactions"
              subtitle="Each day, and over the previous 30 days"
              legend={[{ name: 'Trailing 30 day', color: 'var(--chart-2)' }, { name: 'Daily', color: 'var(--chart-3)' }]}
              caption={<React.Fragment>
                <b>A one off burst on 8 and 9 July skews the 30 day line.</b> About 2,950
                new wallets appeared over those two days and were never seen again. The
                30 day line drops in August simply because they fall out of the window.
              </React.Fragment>}
              height={250}
            >
              {(w, h) => (
                <AreaChart
                  width={w} height={h}
                  labels={labelsOf(c.series)}
                  formatter={fmtNum}
                  series={[
                    { name: 'Trailing 30 day', color: 'var(--chart-2)', values: pick(c.series, 'mau_signers') },
                    { name: 'Daily', color: 'var(--chart-3)', values: pick(c.series, 'dau_signers') },
                  ]}
                />
              )}
            </ChartPanel>

            <ChartPanel
              title="Contracts being used"
              subtitle="Where transactions were sent"
              legend={[{ name: 'Recipients', color: 'var(--chart-5)' }]}
              caption={<React.Fragment>
                <b>How many different places transactions went each day.</b> Steadier than
                the sender line, because apps keep the same contract addresses while they
                rotate the wallets they send from.
              </React.Fragment>}
              height={250}
            >
              {(w, h) => (
                <AreaChart
                  width={w} height={h}
                  labels={labelsOf(c.series)}
                  formatter={fmtNum}
                  series={[{ name: 'Recipients', color: 'var(--chart-5)', values: pick(c.series, 'distinct_recipients') }]}
                />
              )}
            </ChartPanel>
          </div>

          <div className="grid grid-2" style={{ marginTop: 16 }}>
            <TablePanel
              title="Wallets sending the most"
              subtitle="Since launch"
              badge={`${c.top_senders.length} rows`}
              caption={<React.Fragment>
                <b>These belong to apps, not people.</b> Notice how similar the top counts
                are: that is one app taking turns across a pool of its own wallets.
              </React.Fragment>}
            >
              <table className="datatable">
                <thead>
                  <tr>
                    <th>Address</th>
                    <th className="num">Transactions sent</th>
                    <th className="num col-hide-sm">Share of all traffic</th>
                  </tr>
                </thead>
                <tbody>
                  {c.top_senders.slice(0, 15).map((s, i) => (
                    <tr key={s.address}>
                      <td>
                        <div className="asset">
                          <div className="asset-icon" style={{ background: `var(--chart-${(i % 8) + 1})` }}>
                            {String(i + 1)}
                          </div>
                          <div>
                            <a className="asset-name mono"
                              href={`${d.meta.adi_explorer}/address/${s.address}`}
                              target="_blank" rel="noreferrer">{shortAddr(s.address)}</a>
                          </div>
                        </div>
                      </td>
                      <td className="num">{fmtCount(s.txs)}</td>
                      <td className="num col-hide-sm">
                        {fmtPct(c.total_txs ? (100 * s.txs / c.total_txs) : 0, 2)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </TablePanel>

            <TablePanel
              title="Month by month"
              subtitle="Whole calendar months"
              caption={<React.Fragment>
                <b>Wallet counts by month.</b> Useful for seeing how busy the chain has
                become. It is still not a count of people, for the reason at the top of
                this page.
              </React.Fragment>}
            >
              <table className="datatable">
                <thead>
                  <tr>
                    <th>Month</th>
                    <th className="num">Wallets active</th>
                    <th className="num">Transactions sent</th>
                  </tr>
                </thead>
                <tbody>
                  {c.monthly.map(m => (
                    <tr key={m.month}>
                      <td>{m.month}</td>
                      <td className="num">{fmtCount(m.mau_signers)}</td>
                      <td className="num">{fmtCount(m.txs)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </TablePanel>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <Page active="chain"
        title="ADI Chain activity"
        subtitle="Transactions, blocks and distinct signers on ADI Chain, chain ID 36900."
        render={(d) => <ChainActivity d={d} />} />
    );
  </script>
</body>
</html>
