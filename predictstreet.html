<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PredictStreet users</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body data-theme="light" data-aesthetic="institutional" data-density="cozy">
  <script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      var a = localStorage.getItem('aesthetic');
      var d = localStorage.getItem('density');
      if (t) document.body.setAttribute('data-theme', t);
      if (a) document.body.setAttribute('data-aesthetic', a);
      if (d) document.body.setAttribute('data-density', d);
    } catch (e) {}
  })();
  </script>

  <div id="root" class="shell">
    <div class="boot-splash">
      <img class="boot-splash-mark" src="assets/brand/datum-loop.webp" alt="Datum Labs" />
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>

  <script type="text/babel" src="charts.jsx?v=2"></script>
  <script type="text/babel" src="widgets.jsx?v=2"></script>
  <script type="text/babel" src="adi.jsx?v=2"></script>

  <script type="text/babel" data-presets="env,react">
    function lastComplete(rows) {
      for (let i = rows.length - 1; i >= 0; i--) if (!rows[i].partial) return rows[i];
      return rows[rows.length - 1];
    }

    function PredictStreet({ d }) {
      const ps = d.predictstreet;
      if (!ps) {
        return (
          <div className="panel"><div className="panel-body">
            No PredictStreet data in this build. Run <code>python3 scripts/refresh_all.py</code>.
          </div></div>
        );
      }

      const s = ps.series;
      const last = lastComplete(s);
      const peakDau = Math.max.apply(null, s.map(r => r.dau));
      const peakDauDay = (s.find(r => r.dau === peakDau) || {}).date;
      const peakMau = Math.max.apply(null, s.map(r => r.mau));
      const peakReg = Math.max.apply(null, s.map(r => r.new_users));
      const peakRegDay = (s.find(r => r.new_users === peakReg) || {}).date;
      const stickiness = last.mau > 0 ? (last.dau / last.mau) * 100 : null;
      const activation = (last.mau / ps.registered_total) * 100;
      const currentMonth = ps.monthly[ps.monthly.length - 1];

      return (
        <React.Fragment>
          <div className="panel" style={{ marginBottom: 16 }}>
            <PanelHead title="How these users are counted" />
            <div className="panel-caption">
              <b>PredictStreet gives every person their own account on the chain, so we can count people exactly.</b>{' '}
              Each of those accounts is created once and then named in everything that
              person does afterwards. The accounts never send transactions themselves
              {ps.vaults_that_sent_txs === 0 ? '' : ` (well, ${fmtCount(ps.vaults_that_sent_txs)} have)`},
              so we read activity from the records the app writes, not from who paid the
              transaction fee.
            </div>
          </div>

          <div className="grid grid-4" style={{ marginBottom: 16 }}>
            <Metric label="Total sign-ups" value={fmtCount(ps.registered_total)}
              footer="Everyone who has ever signed up" />
            <Metric label="Used it in the last 30 days" value={fmtCount(last.mau)}
              footer={`Best 30 day stretch so far: ${fmtCount(peakMau)}`} />
            <Metric label={`Used it on ${last.date}`} value={fmtCount(last.dau)}
              footer={`Busiest day ever: ${fmtCount(peakDau)} on ${peakDauDay || 'n/a'}`} />
            <Metric label="Would show up in a wallet count" value={fmtPct(ps.signer_visible_pct, 2)}
              footer={`Only ${fmtCount(ps.owners_that_self_signed)} people have sent a transaction themselves`} />
          </div>

          <div className="grid grid-4" style={{ marginBottom: 16 }}>
            <Metric label="Came back to use it" value={fmtPct(activation, 1)}
              footer="Share of sign-ups active in the last 30 days" />
            <Metric label="Use it on a given day" value={stickiness === null ? 'n/a' : fmtPct(stickiness, 2)}
              footer="Of this month's users, the share active on a typical day" />
            <Metric label="Used it this calendar month"
              value={currentMonth ? fmtCount(currentMonth.mau) : 'n/a'}
              footer={currentMonth ? `${currentMonth.month} so far` : 'n/a'} />
            <Metric label="Separate people" value={fmtCount(ps.distinct_owners)}
              footer="One account each, no duplicates" />
          </div>

          <ChartPanel
            title="People using PredictStreet"
            subtitle="Each day, and over the previous 30 days"
              legend={[{ name: 'MAU (30d)', color: 'var(--chart-2)' }, { name: 'DAU', color: 'var(--chart-3)' }]}
            badge={`${fmtCount(s.length)} days`}
            caption={<React.Fragment>
              <b>The 30 day line is slow to react.</b> It still counts people from the
              World Cup weeks. For what is happening now, read the daily line, or the
              month by month table further down.
            </React.Fragment>}
          >
            {(w, h) => (
              <AreaChart
                width={w} height={h}
                labels={labelsOf(s)}
                formatter={fmtNum}
                series={[
                  { name: 'MAU (30d)', color: 'var(--chart-2)', values: pick(s, 'mau') },
                  { name: 'DAU', color: 'var(--chart-3)', values: pick(s, 'dau') },
                ]}
              />
            )}
          </ChartPanel>

          <div className="grid grid-2" style={{ marginTop: 16 }}>
            <ChartPanel
              title="Registrations"
              subtitle="New people each day"
              legend={[{ name: 'New users', color: 'var(--chart-1)' }]}
              badge={`Peak ${fmtCount(peakReg)}`}
              caption={<React.Fragment>
                <b>This shows people arriving, not staying.</b> The busiest day for
                sign-ups was {peakRegDay || 'n/a'}. Signing up happens once, so this
                chart cannot tell you whether anyone came back.
              </React.Fragment>}
              height={250}
            >
              {(w, h) => (
                <AreaChart
                  width={w} height={h}
                  labels={labelsOf(s)}
                  formatter={fmtNum}
                  series={[{ name: 'New users', color: 'var(--chart-1)', values: pick(s, 'new_users') }]}
                />
              )}
            </ChartPanel>

            <ChartPanel
              title="Things people did"
              subtitle="Actions we can trace to a person"
              legend={[{ name: 'Actions', color: 'var(--chart-4)' }]}
              caption={<React.Fragment>
                <b>This counts actions, not people.</b> One person can do many things in
                a single visit, so this moves up and down more sharply than the number
                of users does.
              </React.Fragment>}
              height={250}
            >
              {(w, h) => (
                <AreaChart
                  width={w} height={h}
                  labels={labelsOf(s)}
                  formatter={fmtNum}
                  series={[{ name: 'Actions', color: 'var(--chart-4)', values: pick(s, 'actions') }]}
                />
              )}
            </ChartPanel>
          </div>

          <div className="grid grid-2" style={{ marginTop: 16 }}>
            <TablePanel
              title="Month by month"
              subtitle="Whole calendar months"
              caption={<React.Fragment>
                <b>The clearest view of how usage is trending.</b> Each month stands on
                its own and cannot borrow activity from the month before.
              </React.Fragment>}
            >
              <table className="datatable">
                <thead>
                  <tr>
                    <th>Month</th>
                    <th className="num">People who used it</th>
                    <th className="num">New sign-ups</th>
                    <th className="num col-hide-sm">Users per sign-up</th>
                  </tr>
                </thead>
                <tbody>
                  {ps.monthly.map(m => (
                    <tr key={m.month}>
                      <td>{m.month}</td>
                      <td className="num">{fmtCount(m.mau)}</td>
                      <td className="num">{fmtCount(m.new_users)}</td>
                      <td className="num col-hide-sm">
                        {m.new_users ? (m.mau / m.new_users).toFixed(2) : 'n/a'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </TablePanel>

            <TablePanel
              title="What the app records"
              subtitle="Types of on-chain record"
              badge={`${ps.event_mix.length} events`}
              caption={<React.Fragment>
                <b>PredictStreet has not published its code, so we cannot put names to
                these record types.</b> That does not affect the user counts: whenever a
                record mentions someone's account, we count that person as active.
              </React.Fragment>}
            >
              <table className="datatable">
                <thead>
                  <tr><th>Record type</th><th className="num">Times recorded</th><th className="num col-hide-sm">Share</th></tr>
                </thead>
                <tbody>
                  {ps.event_mix.map(e => {
                    const total = ps.event_mix.reduce((a, x) => a + x.count, 0);
                    return (
                      <tr key={e.sig}>
                        <td className="mono">{e.sig}</td>
                        <td className="num">{fmtCount(e.count)}</td>
                        <td className="num col-hide-sm">{fmtPct(total ? (100 * e.count / total) : 0, 1)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </TablePanel>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <Page active="predictstreet"
        title="PredictStreet users"
        subtitle="Registered users, daily and monthly actives, measured from per-user vault contracts on ADI Chain."
        render={(d) => <PredictStreet d={d} />} />
    );
  </script>
</body>
</html>
